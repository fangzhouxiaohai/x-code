name: Build Desktop Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # skip code signing (unsigned builds; set CSC_LINK etc. to enable)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build & package
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          # --publish never: the Release upload below (softprops) handles publishing;
          # electron-builder itself would otherwise demand GH_TOKEN on tag builds.
          command: npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || 'mac' }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-code-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.os == 'windows-latest' && 'release/*.exe' || 'release/*.dmg' }}
          fail_on_unmatched_files: true
